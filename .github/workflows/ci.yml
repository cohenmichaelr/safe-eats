# CI — MVP-SE-001 §7.
#
# Runs on EVERY push to every branch, and on every pull request. The guards that
# run locally in .githooks/pre-commit run again here, because a local hook can be
# skipped with --no-verify and a fresh clone may not have run `npm install` yet.
name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the credential sweep can see every pushed commit,
          # not just the tip.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard — no credentials in tracked files
        run: node scripts/scan-secrets.js --tracked

      - name: Guard — no destructive SQL against non-local databases
        run: node scripts/guard-sql.js --tracked

      - name: Guard — hooks are installed and executable
        run: node scripts/verify-hooks.js

      - name: Tests
        run: npm test
